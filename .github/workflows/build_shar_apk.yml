name: Build Simpsons Hit & Run Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/share/powershell || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Grant execute permission for gradlew
        run: |
          chmod +x android-project/gradlew gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android-project
          ./gradlew assembleRelease --stacktrace

      - name: Organize output APKs
        run: |
          mkdir -p dist
          find android-project/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Simpsons_HitAndRun_Mods_APK
          path: dist/*.apk
          retention-days: 30
